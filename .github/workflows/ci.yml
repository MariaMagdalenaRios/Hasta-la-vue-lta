name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Kvalitet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  build:
    name: Bygg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utpost
          POSTGRES_PASSWORD: utpost
          POSTGRES_DB: utpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utpost -d utpost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:8.2
        env:
          MONGO_INITDB_ROOT_USERNAME: utpost
          MONGO_INITDB_ROOT_PASSWORD: utpost
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username utpost --password utpost --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://utpost:utpost@localhost:5432/utpost
      MONGO_URL: mongodb://utpost:utpost@localhost:27017/utpost?authSource=admin
      JWT_SECRET: integration-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed databases
        run: npm run seed

      - name: Migrate tour logs to MongoDB
        run: npm run migrate:logs

      - name: Run API integration tests
        run: npm run test:api

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: [quality, build, integration]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mariamagdalenarios/hasta-la-vue-lta-api
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Client image metadata
        id: client_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mariamagdalenarios/hasta-la-vue-lta-client
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.client_meta.outputs.tags }}
          labels: ${{ steps.client_meta.outputs.labels }}
  deploy:
    name: Deploy Azure staging
    runs-on: ubuntu-latest
    needs: [quality, build, integration, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: azure-staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_APP }}" \
            --resource-group "${{ vars.AZURE_RG }}" \
            --container-name api \
            --image "ghcr.io/mariamagdalenarios/hasta-la-vue-lta-api:sha-${GITHUB_SHA::7}"

      - name: Deploy client image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_APP }}" \
            --resource-group "${{ vars.AZURE_RG }}" \
            --container-name client \
            --image "ghcr.io/mariamagdalenarios/hasta-la-vue-lta-client:sha-${GITHUB_SHA::7}"

      - name: Verify deployed SHA via health check
        run: |
          for i in $(seq 1 18); do
            deployed=$(curl --silent --fail "${{ vars.AZURE_URL }}/api/health" | jq -r '.sha // empty' || true)
            echo "Attempt $i: deployed sha='${deployed}' expected='${GITHUB_SHA}'"
            if [ "${deployed}" = "${GITHUB_SHA}" ]; then
              echo "Health check OK: deployed SHA matches commit."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployed SHA did not match ${GITHUB_SHA}"
          exit 1

      - name: Smoke-test GraphQL through the client
        run: |
          response=$(curl --silent --fail --retry 6 --retry-delay 10 --retry-all-errors \
            -X POST "${{ vars.AZURE_URL }}/graphql" \
            -H "Content-Type: application/json" \
            --data '{"query":"{ guides { slug } }"}')
          echo "GraphQL response: ${response}"
          count=$(echo "${response}" | jq '.data.guides | length')
          if [ "${count}" -lt 1 ]; then
            echo "::error::GraphQL returned no database data"
            exit 1
          fi
          echo "GraphQL smoke test OK: ${count} guides returned."

      - name: Record Azure revision name
        run: |
          revision=$(az containerapp show \
            --name "${{ vars.AZURE_APP }}" \
            --resource-group "${{ vars.AZURE_RG }}" \
            --query properties.latestRevisionName -o tsv)
          echo "Azure revision: ${revision}"
          echo "### Azure staging deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`${revision}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-functions:
    name: Deploy → Azure Functions
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: azure-staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --omit=dev

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy function code
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP }}
          package: functions
          sku: flexconsumption
          respect-funcignore: true

      - name: Fetch function key and URL
        run: |
          key=$(az functionapp keys list \
            --name "${{ vars.AZURE_FUNCTION_APP }}" \
            --resource-group "${{ vars.AZURE_RG }}" \
            --query functionKeys.default --output tsv)
          if [ -z "${key}" ]; then
            echo "::error::Could not read the function key"
            exit 1
          fi
          # Mask before the value is used anywhere else, so it never shows in the logs.
          echo "::add-mask::${key}"
          host=$(az functionapp show \
            --name "${{ vars.AZURE_FUNCTION_APP }}" \
            --resource-group "${{ vars.AZURE_RG }}" \
            --query "defaultHostName || properties.defaultHostName" --output tsv)
          echo "FUNCTION_KEY=${key}" >> "$GITHUB_ENV"
          echo "FUNCTION_URL=https://${host}/api/process-image" >> "$GITHUB_ENV"

      - name: Smoke-test process-image
        run: |
          # Generous timeout and retries for cold starts and deployment sync.
          response=$(curl --silent --show-error --fail \
            --max-time 120 --retry 6 --retry-delay 15 --retry-all-errors \
            -X POST "${FUNCTION_URL}" \
            -H "x-functions-key: ${FUNCTION_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"filename":"smoke.jpg","width":400,"height":300}')

          count=$(printf '%s' "${response}" | jq -er '
            if (.variants | type) == "array" then
              (.variants | length)
            else
              error("variants is not an array")
            end
          ') || {
            echo "::error::Function returned invalid JSON or missing variants"
            exit 1
          }

          if [ "${count}" -ne 4 ]; then
            echo "::error::Expected 4 image variants, got ${count}"
            exit 1
          fi

          echo "Smoke test OK: ${count} image variants returned."
          echo "### Azure Functions deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function app: \`${{ vars.AZURE_FUNCTION_APP }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variants: ${count}" >> "$GITHUB_STEP_SUMMARY"
