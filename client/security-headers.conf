# Security headers, included from every location in default.conf.template.
#
# nginx only inherits add_header from the server block into a location that
# has no add_header of its own. Including this file in each location keeps
# the headers from silently disappearing when someone adds one later.
# "always" sends them on error responses (4xx/5xx) too.

# The app only loads scripts, styles, images and API calls from its own origin.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
