services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: utpost
      POSTGRES_PASSWORD: utpost
      POSTGRES_DB: utpost
    ports:
      - "5433:5432"
    volumes:
      - utpost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utpost -d utpost"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: utpost
      MONGO_INITDB_ROOT_PASSWORD: utpost
    ports:
      - "27017:27017"
    volumes:
      - utpost_mongodata:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "utpost",
          "--password",
          "utpost",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      args:
        GIT_SHA: dev
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://utpost:utpost@postgres:5432/utpost
      MONGO_URL: mongodb://utpost:utpost@mongo:27017/utpost?authSource=admin
      IMAGE_FUNCTION_URL: http://host.docker.internal:7071/api/process-image
      # Local-only fallback. Real environments must provide their own JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-do-not-use-elsewhere}
      # CMS is optional: empty values switch it off and the app runs without notices.
      CONTENTFUL_SPACE_ID: ${CONTENTFUL_SPACE_ID:-}
      CONTENTFUL_ENVIRONMENT: ${CONTENTFUL_ENVIRONMENT:-master}
      CONTENTFUL_DELIVERY_TOKEN: ${CONTENTFUL_DELIVERY_TOKEN:-}
      CONTENTFUL_PREVIEW_TOKEN: ${CONTENTFUL_PREVIEW_TOKEN:-}
      CMS_CACHE_SECONDS: ${CMS_CACHE_SECONDS:-60}
    expose:
      - "4000"
    # `docker compose up --wait` needs this to know when the API is really
    # ready. /api/health also pings Postgres and Mongo and returns 503 if
    # either is down, which makes wget exit non-zero.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      API_UPSTREAM: http://api:4000
    ports:
      - "3001:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

volumes:
  utpost_pgdata:
  utpost_mongodata:
